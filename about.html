<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Apostille Verification System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
    <div class="header-container">
        <div class="header-text">
            <h1>Legalization / Apostille Verification System</h1>
        </div>
    </div>
</header>

<main class="content">
    <form class="verification-form" id="verificationForm">
        <label for="apostille-number">Legalization / Apostille Number</label>
        <input
            type="text"
            id="apostille-number"
            placeholder="Enter apostille number"
            required
        >

        <!-- ✅ NEW: Date instead of Sticker -->
        <label for="issue-date">Date of issue</label>
        <input
            type="date"
            id="issue-date"
            required
        >

        <!-- ➕ OPTIONAL: Referral code -->
        <label for="referral-code">Referral code (optional)</label>
        <input
            type="text"
            id="referral-code"
            placeholder="Enter referral code (if any)"
        >

        <button type="submit" class="btn btn-main">
            Manual Verification
        </button>

        <a href="#" class="samples-link">View the samples</a>

        <button type="button" id="scan-qr-btn" class="btn btn-secondary">
            Scan the QR code
        </button>

        <a href="index.html" class="btn btn-secondary">
            Upload your Postal
        </a>
    </form>
</main>

<!-- ======================
     QR MODAL
====================== -->
<div id="qr-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:9999; padding:16px;">
    <div style="max-width:520px; margin:40px auto; background:#fff; border-radius:12px; padding:14px;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <strong>Scan QR Code</strong>
            <button type="button" id="close-qr-btn" class="btn btn-secondary">Close</button>
        </div>

        <p style="font-size:13px; color:#495057; margin:10px 0;">
            Point the camera at the QR code
        </p>

        <div id="qr-reader" style="width:100%;"></div>
        <p id="qr-status" style="font-size:13px; color:#495057; margin-top:8px;"></p>
    </div>
</div>

<script src="https://unpkg.com/html5-qrcode@2.3.10/html5-qrcode.min.js"></script>

<!-- ======================
     SUPABASE + LOGIC
====================== -->
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const SUPABASE_URL = "https://frfbftfyoujcqbidaiji.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZyZmJmdGZ5b3VqY3FiaWRhaWppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ3NjA1NDksImV4cCI6MjA4MDMzNjU0OX0.uGAY7_ezLWDjcrxDAcPSraBcIqas6dEgOTTXAsRzdJg";

const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const form = document.getElementById("verificationForm");
const apostilleInput = document.getElementById("apostille-number");
const dateInput = document.getElementById("issue-date");
const referralInput = document.getElementById("referral-code");

/* ======================
   MANUAL VERIFICATION
====================== */
form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const apostille = apostilleInput.value.trim();
    const issueDate = dateInput.value;
    const referral = referralInput.value.trim(); // optional

    if (!apostille || !issueDate) {
        alert("Please fill in all required fields.");
        return;
    }

    // Safari-safe popup
    const pdfTab = window.open("", "_blank");

    try {
        const { data, error } = await db
            .from("apostilles")
            .select("*")
            .eq("apostille_number", apostille)
            .eq("issue_date", issueDate)
            .maybeSingle();

        if (error) throw error;

        if (!data) {
            if (pdfTab) pdfTab.close();
            alert("No document found for the provided data.");
            return;
        }

        const { data: fileData } = db
            .storage
            .from("apostilles")
            .getPublicUrl(data.file_path);

        const pdfUrl = fileData?.publicUrl;

        if (!pdfUrl) {
            if (pdfTab) pdfTab.close();
            alert("Document file not available.");
            return;
        }

        if (pdfTab) {
            pdfTab.location.href = pdfUrl;
            pdfTab.focus();
        }

        // Referral code можно передавать дальше, если понадобится
        const params = new URLSearchParams({
            apostille,
            date: issueDate
        });
        if (referral) params.set("ref", referral);

        window.location.href = `index.html?${params.toString()}`;

    } catch (err) {
        if (pdfTab) pdfTab.close();
        console.error(err);
        alert("Verification failed. Please try again.");
    }
});
</script>

</body>
</html>
